<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTROGATION — M31 への航海(認証済みカタログの可視化)</title>
<style>
  :root {
    --ink: #dfe6ee; --ink-dim: #8b97a5; --accent: #7dd3fc;
    --amber: #fcd34d; --panel: rgba(10, 14, 20, 0.72);
    --line: rgba(125, 211, 252, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #04050a; }
  body { font-family: "Hiragino Sans", "Helvetica Neue", sans-serif;
         color: var(--ink); }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }
  .mono { font-family: ui-monospace, Menlo, monospace; }

  /* 幕タイトル */
  #act-title { position: fixed; top: 4.5vh; left: 5vw; pointer-events: none; }
  #act-title .no { font-size: 0.75rem; letter-spacing: 0.35em;
                   color: var(--accent); opacity: 0.85; }
  #act-title .name { font-size: 1.7rem; font-weight: 300;
                     letter-spacing: 0.22em; margin-top: 0.3rem;
                     text-shadow: 0 0 18px rgba(0,0,0,0.8); }

  /* 字幕 */
  #caption { position: fixed; bottom: 13vh; width: 100%; text-align: center;
             pointer-events: none; font-size: 1.02rem; font-weight: 300;
             letter-spacing: 0.14em; color: var(--ink);
             text-shadow: 0 1px 14px rgba(0,0,0,0.9);
             opacity: 0; transition: opacity 1.1s ease; }
  #caption.show { opacity: 1; }

  /* 航路儀(計器盤) — 全数値は physics.js の出力 */
  #panel { position: fixed; right: 1.4rem; top: 50%; transform: translateY(-50%);
           width: 250px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 0.9rem 1rem 0.8rem;
           backdrop-filter: blur(6px); font-size: 0.74rem; }
  #panel h2 { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.3em;
              color: var(--accent); margin-bottom: 0.55rem; }
  #panel .row { display: flex; justify-content: space-between;
                padding: 0.14rem 0; color: var(--ink-dim); }
  #panel .row b { color: var(--ink); font-weight: 500; }
  #panel .sep { border-top: 1px solid var(--line); margin: 0.45rem 0; }
  #tierbar { position: relative; height: 30px; margin: 0.3rem 0 0.1rem;
             background: rgba(125,211,252,0.05); border-radius: 4px; }
  #tierbar .tick { position: absolute; top: 0; bottom: 0; width: 2px;
                   border-radius: 1px; }
  #tierbar .lam { position: absolute; top: -3px; width: 8px; height: 36px;
                  border-radius: 4px; background: var(--amber);
                  box-shadow: 0 0 8px rgba(252,211,77,0.7); }
  #tierbar-legend { display: flex; justify-content: space-between;
                    font-size: 0.6rem; color: var(--ink-dim); }
  #ladder { margin-top: 0.15rem; }
  #ladder .lrow { display: flex; justify-content: space-between;
                  padding: 0.1rem 0.3rem; border-radius: 4px;
                  color: var(--ink-dim); }
  #ladder .lrow.hot { background: rgba(125,211,252,0.14); color: var(--ink); }

  /* 幕 5: フラッシュ計 */
  #flashmeter { position: fixed; left: 50%; bottom: 21vh;
                transform: translateX(-50%); width: 380px; display: none;
                background: var(--panel); border: 1px solid var(--line);
                border-radius: 10px; padding: 0.7rem 1rem; font-size: 0.74rem; }
  #flashmeter .fbar { height: 8px; border-radius: 4px; margin: 0.4rem 0;
                      background: rgba(125,211,252,0.08); overflow: hidden; }
  #flashmeter .fbar > div { height: 100%; width: 0%;
                            background: linear-gradient(90deg,#fef3c7,#fcd34d,#f59e0b);
                            border-radius: 4px; }
  #flashmeter .frow { display: flex; justify-content: space-between;
                      color: var(--ink-dim); }
  #flashmeter b { color: var(--ink); font-weight: 500; }

  /* 操作系 */
  #controls { position: fixed; left: 5vw; bottom: 4.5vh; display: flex;
              gap: 0.45rem; align-items: center; }
  #controls button { background: var(--panel); color: var(--ink);
                     border: 1px solid var(--line); border-radius: 7px;
                     font-size: 0.78rem; padding: 0.42rem 0.75rem;
                     cursor: pointer; letter-spacing: 0.08em; }
  #controls button:hover { border-color: var(--accent); color: var(--accent); }
  #controls button.on { color: var(--accent); border-color: var(--accent); }
  #progress { position: fixed; left: 0; bottom: 0; height: 3px; width: 0%;
              background: var(--accent); opacity: 0.6; }

  /* 境界宣言(常時 1 行) */
  #boundary { position: fixed; right: 1.4rem; bottom: 1.1rem;
              font-size: 0.62rem; color: var(--ink-dim); text-align: right;
              pointer-events: none; }
  #boundary .green { color: #34d399; } #boundary .red { color: #f87171; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at center,
                transparent 55%, rgba(0,0,0,0.45) 100%); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>

<div id="act-title"><div class="no"></div><div class="name"></div></div>
<div id="caption"></div>

<aside id="panel">
  <h2>航 路 儀</h2>
  <div class="row"><span>η(ラピディティ)</span><b class="mono" id="hud-eta">—</b></div>
  <div class="row"><span>β = tanh η</span><b class="mono" id="hud-beta">—</b></div>
  <div class="row"><span>m / m₀</span><b class="mono" id="hud-m">—</b></div>
  <div class="row"><span>x = 2m/R</span><b class="mono" id="hud-x">—</b></div>
  <div class="sep"></div>
  <div class="row"><span>λ = aR(現在)</span><b class="mono" id="hud-lam">—</b></div>
  <div id="tierbar">
    <div class="tick" style="background:#f87171" id="tick-floor"></div>
    <div class="tick" style="background:#7dd3fc" id="tick-eff"></div>
    <div class="tick" style="background:#a5b4fc" id="tick-ceil"></div>
    <div class="lam" id="lam-dot"></div>
  </div>
  <div id="tierbar-legend"><span>0</span><span>フロンティア三層</span><span>0.40</span></div>
  <div class="sep"></div>
  <div class="row"><span>座席の値段 e²η</span><b class="mono" id="hud-price">—</b></div>
  <div id="ladder"></div>
  <div class="sep"></div>
  <div class="row"><span>目的地 M31</span><b class="mono" id="hud-dist">—</b></div>
  <div class="row"><span>η₅₀(片道・寿命50年)</span><b class="mono" id="hud-eta50">—</b></div>
  <div class="row"><span>予測 m_f/m₀</span><b class="mono" id="hud-mf">—</b></div>
</aside>

<div id="flashmeter">
  <div class="frow"><span>受信フラックス F·D²(対数計)</span><b class="mono" id="fm-val">—</b></div>
  <div class="fbar"><div id="fm-bar"></div></div>
  <div class="frow"><span>減衰尺(R = 1 km 仮定)</span><b class="mono" id="fm-tau">—</b></div>
</div>

<div id="controls">
  <button id="btn-play">⏸ 一時停止</button>
  <button data-act="0">1 出発</button>
  <button data-act="1">2 巡航</button>
  <button data-act="2">3 反転</button>
  <button data-act="3">4 減速</button>
  <button data-act="4">5 到着</button>
</div>
<div id="progress"></div>

<div id="boundary">
  物理: <span class="mono">physics.js</span>(P4-C20 <span id="c20-badge">…</span>)/
  色・ペーシングは演出(<span class="mono">README</span> に境界宣言)
</div>

<script src="physics.js"></script>
<script src="test_snapshot.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
