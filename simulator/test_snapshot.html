<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>P4-C20 — physics.js スナップショット認証</title>
<style>
  body { font-family: ui-monospace, Menlo, monospace; background: #101014;
         color: #e8e8e8; padding: 2rem; }
  h1 { font-size: 1.1rem; font-weight: 600; }
  .verdict { font-size: 1.4rem; margin: 1rem 0; }
  .green { color: #34d399; } .red { color: #f87171; }
  table { border-collapse: collapse; font-size: 0.82rem; }
  td, th { padding: 2px 10px; border-bottom: 1px solid #2a2a30; text-align: left; }
  td.rel { color: #9ca3af; }
</style>
</head>
<body>
<h1>P4-C20 — physics.js スナップショット認証(相対 1e-10、出典: results/ @ v1.0-paper)</h1>
<div id="verdict" class="verdict">running…</div>
<table id="rows"><tr><th></th><th>test</th><th>rel. err</th></tr></table>
<script src="physics.js"></script>
<script src="test_snapshot.js"></script>
<script>
  const rs = window.SNAPSHOT_RUN();
  const fails = rs.filter(r => !r.pass).length;
  const v = document.getElementById("verdict");
  v.textContent = fails === 0
    ? `ALL GREEN — ${rs.length}/${rs.length} passed`
    : `${fails} FAILED / ${rs.length}`;
  v.className = "verdict " + (fails === 0 ? "green" : "red");
  const tbl = document.getElementById("rows");
  for (const r of rs) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="${r.pass ? "green" : "red"}">${r.pass ? "✓" : "✗"}</td>` +
      `<td>${r.name}</td><td class="rel">${r.rel.toExponential(2)}</td>`;
    tbl.appendChild(tr);
  }
</script>
</body>
</html>
