[project]
name = "astrogation"
version = "0.1.0"
description = "Admissibility-constrained interstellar maneuver catalog and observational signatures for Le's positive-energy warp shells (arXiv:2606.22531v3)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
